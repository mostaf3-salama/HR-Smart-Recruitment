<div class="auth-page" dir="ltr">
  <form class="card" [formGroup]="form" (ngSubmit)="submit()" aria-label="Register">
    <h1>Create account ✨</h1>
    <p class="subtitle">Registration creates a <strong>Candidate</strong> account. HR accounts are created by the admin.</p>

    <label class="field">
      <span>Full name</span>
      <input type="text" formControlName="name" autocomplete="name" placeholder="Your name" />
    </label>

    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" placeholder="you@mail.com" />
    </label>

    <label class="field">
      <span>Password (min 6 characters)</span>
      <input type="password" formControlName="password" autocomplete="new-password" placeholder="••••••••" />
    </label>

    <label class="field">
      <span>Confirm password</span>
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" placeholder="••••••••" />
      <span class="field-error" *ngIf="form.touched && form.hasError('mismatch')">Passwords do not match.</span>
    </label>

    <p class="error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

    <button type="submit" class="btn-primary" [disabled]="busy">
      {{ busy ? 'Creating…' : 'Register' }}
    </button>

    <p class="switch">Have an account? <a routerLink="/auth/login">Log in</a></p>
  </form>
</div>
